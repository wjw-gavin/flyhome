name: Fetch prices

on:
  schedule:
    # Mon 07:00 Dubai time; Thu/Fri/Sat departures × 12 weeks × 1 group ≈ 36 searches/run (free tier 250/month).
    - cron: '0 3 * * 1'
  workflow_dispatch:
    inputs:
      out:
        description: '自定义出发日期 YYYY-MM-DD（留空 = 全量扫描）'
        required: false
        type: string
      ret:
        description: '自定义返回日期 YYYY-MM-DD（留空 = 出发 + 28 天）'
        required: false
        type: string

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: fetch

jobs:
  fetch:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/fetch.mjs
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          CUSTOM_OUT: ${{ inputs.out }}
          CUSTOM_RET: ${{ inputs.ret }}
      - id: commit
        env:
          CUSTOM_OUT: ${{ inputs.out }}
        run: |
          git config user.name "flyhome-bot"
          git config user.email "flyhome-bot@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            if [ -n "$CUSTOM_OUT" ]; then msg="custom: $CUSTOM_OUT"; else msg="data: $(TZ=Asia/Dubai date +%F)"; fi
            git commit -m "$msg"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  # Pushes made with GITHUB_TOKEN never trigger the push workflow, so deploy explicitly.
  deploy:
    needs: fetch
    if: needs.fetch.outputs.changed == 'true'
    uses: ./.github/workflows/deploy.yml
