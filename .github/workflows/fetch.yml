name: Fetch prices

on:
  # Manual only (page button or Actions → Run workflow): 2 groups × 12 date pairs = 24 searches per run.
  # To re-enable a schedule add e.g.  schedule: [{ cron: '0 3 * * 1' }]  (Mon 07:00 Dubai ≈ 100 searches/month).
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: fetch

jobs:
  fetch:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/fetch.mjs
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
      - id: commit
        run: |
          git config user.name "flyhome-bot"
          git config user.email "flyhome-bot@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "data: $(TZ=Asia/Dubai date +%F)"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  # Pushes made with GITHUB_TOKEN never trigger the push workflow, so deploy explicitly.
  deploy:
    needs: fetch
    if: needs.fetch.outputs.changed == 'true'
    uses: ./.github/workflows/deploy.yml
